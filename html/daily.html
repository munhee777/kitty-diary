<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일상 다이어리 🧸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>My Daily Diary</h1>
        <p class="subtitle">소소하고 소중한 매일의 기록 🧸</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">🧸 일상</span>
      </div>

      <section class="diary-form-card">
        <div class="date-mood-row">
          <div class="input-group">
            <label for="diary-date">📅 날짜</label>
            <input type="date" id="diary-date" value="2026-08-29">
          </div>
          <div class="input-group">
            <label for="diary-mood">🎀 오늘의 기분</label>
            <select id="diary-mood">
              <option>행복해요 💖</option>
              <option>평온해요 🌸</option>
              <option>피곤해요 💤</option>
            </select>
          </div>
        </div>
        <div class="input-group">
          <label>제목</label>
          <input type="text" placeholder="오늘 하루 일상 이야기...">
        </div>
        <div class="input-group">
          <label>일기 내용</label>
          <textarea rows="7" placeholder="오늘 어떤 소소한 일들이 있었나요?"></textarea>
        </div>
        <button type="button" class="save-btn" onclick="alert('일상 일기가 저장되었습니다! 💌')">일상 일기 저장하기 💌</button>
      </section>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>
</body>
</html>
