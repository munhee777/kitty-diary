<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감정 다이어리 💭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
  <link rel="stylesheet" href="../css/emotion.css">
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>My Emotion Diary</h1>
        <p class="subtitle">내 솔직한 마음과 감정을 들여다보는 시간 💭</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">💭 감정</span>
      </div>

      <section class="diary-form-card">
        <div class="date-mood-row">
          <div class="input-group">
            <label for="emotion-date">📅 날짜</label>
            <input type="date" id="emotion-date" value="2026-08-31">
          </div>
          <div class="input-group">
            <label for="emotion-select">💭 지금 나의 감정</label>
            <select id="emotion-select">
              <option>💖 두근두근/설렘</option>
              <option>😊 뿌듯함/행복</option>
              <option>🥺 울적함/속상함</option>
              <option>😠 화남/답답함</option>
              <option>🧘 평온함/차분함</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="emotion-title">💌 감정 제목</label>
          <input type="text" id="emotion-title" placeholder="오늘 내 마음에 붙일 제목은?">
        </div>

        <div class="input-group">
          <label for="emotion-reason">🔍 이런 감정이 든 이유</label>
          <textarea id="emotion-reason" rows="4" placeholder="어떤 일이나 생각 때문에 이런 감정이 들었나요? 자유롭게 털어놓아 보세요."></textarea>
        </div>

        <div class="input-group">
          <label for="emotion-comfort">🎀 나에게 건네는 한마디 (토닥토닥)</label>
          <textarea id="emotion-comfort" rows="3" placeholder="오늘 하루도 수고한 나 자신에게 따뜻한 위로와 응원을 남겨주세요 ₍ᐢ.ˬ.ᐢ₎"></textarea>
        </div>

        <button type="button" class="save-btn" id="save-emotion-btn">감정 일기 저장하기 💭</button>
      </section>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/emotion.js"></script>
</body>
</html>
