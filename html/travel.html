<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 다이어리 ✈️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
  <link rel="stylesheet" href="../css/travel.css">
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>My Travel Diary</h1>
        <p class="subtitle">설레는 발걸음과 새로운 풍경 ✈️</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">✈️ 여행</span>
      </div>

      <section class="diary-form-card">
        <div class="date-mood-row">
          <div class="input-group">
            <label for="travel-date">📅 여행 날짜</label>
            <input type="date" id="travel-date" value="2026-08-31">
          </div>
          <div class="input-group">
            <label for="travel-location">📍 여행지</label>
            <input type="text" id="travel-location" placeholder="예: 제주 애월 / 일본 후쿠오카">
          </div>
        </div>

        <div class="input-group">
          <label for="travel-title">✈️ 여행 일기 제목</label>
          <input type="text" id="travel-title" placeholder="설레는 여행 제목을 지어주세요!">
        </div>

        <!-- 여행 사진 첨부 영역 -->
        <div class="input-group">
          <label>📸 여행 사진 첨부</label>
          <input type="file" id="travel-photo-input" class="file-input-hidden" accept="image/*">
          
          <div class="photo-upload-container" id="upload-trigger">
            <span class="upload-icon">📷</span>
            <span class="upload-text" style="font-weight: bold; color: #ff1493; font-size: 1.15rem;">클릭해서 여행 사진 넣기</span>
            <span class="upload-hint">풍경이나 추억이 담긴 사진을 선택해주세요</span>
          </div>

          <div class="preview-box" id="preview-box">
            <img src="" alt="여행 사진 미리보기" class="preview-img" id="preview-img">
            <button type="button" class="remove-photo-btn" id="remove-photo">✕</button>
          </div>
        </div>

        <div class="input-group">
          <label for="travel-content">📝 여행의 추억 기록</label>
          <textarea id="travel-content" rows="6" placeholder="여행지에서 만난 특별한 순간들, 맛있는 음식, 느꼈던 감정들을 자유롭게 적어보세요 ₍ᐢ.ˬ.ᐢ₎"></textarea>
        </div>

        <button type="button" class="save-btn" id="save-travel-btn">여행 일기 저장하기 🛫</button>
      </section>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>

  <script src="../js/travel.js"></script>
</body>
</html>
