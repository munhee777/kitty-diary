<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감정 기록 보관함 💭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
  <link rel="stylesheet" href="../css/emotion.css">
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>Emotion Archives</h1>
        <p class="subtitle">내 마음을 보살핀 감정의 기록들 💭</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">💭 감정</span>
      </div>

      <div class="list-header-row">
        <h2 class="list-title">내 마음의 조각들 💌</h2>
      </div>

      <!-- 저장된 감정 카드들이 렌더링되는 영역 -->
      <div class="diary-cards-container" id="emotion-cards-container"></div>

      <div class="bottom-write-wrap">
        <a href="emotion.html" class="bottom-new-write-btn">💭 또 다른 내 감정 기록하러 가기 💌</a>
      </div>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>

  <!-- 감정 상세 보기 모달 -->
  <div class="emotion-modal-overlay" id="emotion-detail-modal">
    <div class="emotion-modal-content">
      <div class="emotion-modal-header">
        <h3>💭 감정 기록 펼쳐보기</h3>
        <button type="button" class="emotion-modal-close-btn" id="emotion-modal-close-btn">✕</button>
      </div>

      <div class="emotion-detail-meta">
        <span id="detail-emotion-date">📅 2026.08.31</span>
        <span class="emotion-badge" id="detail-emotion-badge">감정</span>
      </div>

      <h2 class="emotion-detail-title" id="detail-emotion-title">제목</h2>

      <div class="emotion-box-section">
        <span class="emotion-box-title">🔍 이런 감정이 든 이유</span>
        <p class="emotion-box-text" id="detail-emotion-reason"></p>
      </div>

      <div class="emotion-box-section">
        <span class="emotion-box-title">🎀 나에게 건넨 따뜻한 한마디</span>
        <p class="emotion-box-text" id="detail-emotion-comfort"></p>
      </div>

      <div class="emotion-modal-actions">
        <button type="button" class="emotion-detail-delete-btn" id="detail-emotion-delete-btn">일기 삭제 🗑️</button>
      </div>
    </div>
  </div>

  <script src="../js/emotion.js"></script>
</body>
</html>
