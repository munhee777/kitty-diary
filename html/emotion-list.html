<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감정 노트 보관함 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
  <link rel="stylesheet" href="../css/emotion.css">
  
  
  <style>
    .list-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .list-title { font-size: 1.5rem; color: #ff007f; }
    .new-write-btn {
      text-decoration: none; background-color: #ff1493; color: #ffffff;
      padding: 6px 14px; border-radius: 12px; font-weight: 700; font-size: 1.05rem;
    }
    .diary-cards-container { display: flex; flex-direction: column; gap: 14px; }
    .entry-card-box {
      background-color: #ffffff; border-radius: 18px; border: 2px solid #ffd0df;
      border-left: 6px solid #ff1493; padding: 16px 18px;
    }
    .entry-top { display: flex; justify-content: space-between; font-size: 1.05rem; color: #a86b7c; margin-bottom: 6px; }
    .entry-title { font-size: 1.35rem; color: #d11271; margin-bottom: 6px; }
    .entry-body { font-size: 1.15rem; line-height: 1.5; color: #523b42; }
  </style>
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>Emotion Archives</h1>
        <p class="subtitle">솔직한 내 마음의 기록들 💖</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">💖 감정</span>
      </div>

      <div class="list-header-row">
        <h2 class="list-title">내 마음 서랍장 💭</h2>
        <a href="emotion.html" class="new-write-btn">✏️ 새 감정 쓰기</a>
      </div>

      <div class="diary-cards-container">
        <article class="entry-card-box">
          <div class="entry-top">
            <span>📅 2026.08.29</span>
            <span>마음: 벅차오르게 행복해요 ✨</span>
          </div>
          <h3 class="entry-title">작은 성취가 준 큰 기쁨</h3>
          <p class="entry-body">오늘 하루 동안 계획했던 일들을 모두 마쳤다. 스스로에게 칭찬해주고 싶은 뿌듯한 밤이다.</p>
        </article>
      </div>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>
</body>
</html>
