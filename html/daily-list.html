<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일상 기록 보관함 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/diary.css">
  <link rel="stylesheet" href="../css/daily.css">
</head>
<body>
  <div class="diary-wrapper">
    <header class="diary-header">
      <div class="kitty-img-container">
        <img src="../img/kitty.png" alt="일기 쓰는 헬로키티" class="kitty-writing-img">
      </div>
      <div class="header-text">
        <h1>Daily Archives</h1>
        <p class="subtitle">소소하고 소중한 매일의 조각들 🌸</p>
      </div>
    </header>

    <main class="diary-content">
      <div class="nav-top-row">
        <a href="home.html" class="back-home-btn">🏠 홈으로</a>
        <span class="badge">🌸 일상</span>
      </div>

      <div class="list-header-row">
        <h2 class="list-title">내 일상 이야기 📖</h2>
      </div>

      <!-- 저장된 일기들이 렌더링되는 영역 -->
      <div class="diary-cards-container" id="daily-cards-container"></div>

      <div class="bottom-write-wrap">
        <a href="daily.html" class="bottom-new-write-btn">🌸 또 다른 오늘 하루 기록하러 가기 💌</a>
      </div>
    </main>

    <footer class="diary-footer">
      <p>© 2026 My Pink Hello Kitty Diary 🎀</p>
    </footer>
  </div>

  <!-- 상세 보기 모달 -->
  <div class="daily-modal-overlay" id="daily-detail-modal">
    <div class="daily-modal-content">
      <div class="daily-modal-header">
        <h3>🌸 일상 일기 펼쳐보기</h3>
        <button type="button" class="daily-modal-close-btn" id="daily-modal-close-btn">✕</button>
      </div>

      <div class="daily-detail-meta">
        <span id="detail-daily-date">📅 2026.08.31</span>
        <span class="daily-badge-mood" id="detail-daily-mood">기분</span>
      </div>

      <h2 class="daily-detail-title" id="detail-daily-title">제목</h2>

      <img src="" alt="일상 사진" class="daily-detail-img" id="detail-daily-img">
      <p class="daily-detail-body" id="detail-daily-body"></p>

      <div class="daily-modal-actions">
        <button type="button" class="daily-detail-delete-btn" id="detail-daily-delete-btn">일기 삭제 🗑️</button>
      </div>
    </div>
  </div>

  <script src="../js/daily.js"></script>
</body>
</html>
